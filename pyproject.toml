[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis personal Windows AI desktop agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
